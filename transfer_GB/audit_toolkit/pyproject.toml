[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "genome-ml-reportcard"
version = "0.1.1"
description = "GenomeML Report Card: estimand-matched audit for genome ML evaluation"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Xindi Wang" }]
keywords = ["genomics", "machine-learning", "benchmark", "evaluation", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.20",
  "pandas>=1.3",
  "scipy>=1.7",
  "scikit-learn>=1.0",
]

[project.urls]
Homepage = "https://github.com/Xindi-Wang1004/Spillover"
Documentation = "https://github.com/Xindi-Wang1004/Spillover/tree/main/transfer_GB/audit_toolkit"
Repository = "https://github.com/Xindi-Wang1004/Spillover"

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.0"]

[project.scripts]
genome-ml-reportcard = "genome_ml_reportcard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["genome_ml_reportcard*"]
